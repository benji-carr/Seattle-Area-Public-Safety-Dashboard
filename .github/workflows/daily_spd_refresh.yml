name: Daily SPD dashboard refresh

on:
  workflow_call:
    inputs:
      only_if_stale:
        description: Recheck main after waiting for any active refresh before recovering
        type: boolean
        default: false
    secrets:
      REFRESH_PR_TOKEN:
        required: true
      CARTO_BASEMAP_API_KEY:
        required: true
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-spd-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      REFRESH_BRANCH: automation/daily-data-refresh-${{ github.run_id }}
      CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      # This runs after acquiring the workflow concurrency slot and checking out main.
      # A daily refresh may have fixed the stale data while recovery was queued.
      - name: Decide whether a full refresh is still needed
        id: refresh_needed
        env:
          ONLY_IF_STALE: ${{ inputs.only_if_stale }}
        shell: bash
        run: |
          if [ "$ONLY_IF_STALE" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python -m scripts.dashboard.check_data_freshness --dataset all
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Main is now fresh; skipping duplicate recovery refresh."
          elif [ "$status" -eq 2 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Freshness checker failed with exit code $status; refusing recovery." >&2
            exit "$status"
          fi

      - name: Create refresh branch
        if: steps.refresh_needed.outputs.run == 'true'
        run: |
          git switch -c "$REFRESH_BRANCH"

      - name: Refresh SPD crime data and collect observation
        id: crime_collection
        if: steps.refresh_needed.outputs.run == 'true'
        run: |
          python -m scripts.dashboard.refresh_crime_data --observation-root "${{ runner.temp }}/crime-observations"

      # Publish any completed capture even if crime's later dashboard freshness check fails.
      # The manifest is uploaded last; no unrelated dataset runs before this archive step.
      - name: Archive crime observation
        if: ${{ !cancelled() && steps.refresh_needed.outputs.run == 'true' && steps.crime_collection.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.crime_collection.outcome }}" = "failure" ] && ! compgen -G "${{ runner.temp }}/crime-observations/*/manifest.json" > /dev/null; then
            echo "No completed crime capture to archive; the original collection failure remains fatal."
            exit 0
          fi
          python -m scripts.dashboard.archive_crime_observations --repo "$GITHUB_REPOSITORY" --root "${{ runner.temp }}/crime-observations"

      # Temporary recovery copy, including after release-upload/freshness failure.
      # Only visible, atomically completed bundles match; hidden pending writes do not.
      - name: Back up completed crime observations
        if: ${{ always() && steps.refresh_needed.outputs.run == 'true' && steps.crime_collection.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: crime-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/crime-observations/*/snapshot.parquet
            ${{ runner.temp }}/crime-observations/*/manifest.json
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false
          compression-level: 0

      - name: Refresh SPD calls data
        if: steps.refresh_needed.outputs.run == 'true'
        run: |
          python -m scripts.dashboard.refresh_call_metrics

      - name: Refresh SPD use of force data
        if: steps.refresh_needed.outputs.run == 'true'
        run: |
          python -m scripts.dashboard.refresh_uof_data

      - name: Remove generated geography lookup caches
        if: steps.refresh_needed.outputs.run == 'true'
        run: |
          rm -f data/processed/geography/crime_event_mcpp_lookup.parquet

      - name: Rebuild dashboard contexts
        if: steps.refresh_needed.outputs.run == 'true'
        run: |
          python -c "from dashboard.crime_call_support_data import load_crime_call_support_context; load_crime_call_support_context(); print('Calls metric context loaded')"
          python -c "from dashboard.crime_dashboard_data import load_crime_dashboard_context; load_crime_dashboard_context(); print('Crime context loaded')"
          python -c "from dashboard.uof_dashboard_data import load_uof_dashboard_context; load_uof_dashboard_context(); print('UOF context loaded')"

      - name: Run smoke tests
        if: steps.refresh_needed.outputs.run == 'true'
        run: |
          python -m scripts.dashboard.smoke_check

      - name: Run dashboard freshness tests
        if: steps.refresh_needed.outputs.run == 'true'
        run: |
          python -m pytest tests/dashboard/test_data_freshness.py tests/dashboard/test_call_metrics_refresh.py tests/dashboard/test_crime_call_support_data.py -q

      - name: Check dashboard source freshness
        if: steps.refresh_needed.outputs.run == 'true'
        run: |
          python -m scripts.dashboard.check_data_freshness --dataset all

      - name: Commit refreshed data
        if: steps.refresh_needed.outputs.run == 'true'
        id: commit_refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/processed/calls_metrics/spd_calls.parquet
          git add data/processed/calls_metrics/spd_calls_metadata.json

          git add data/processed/crime/crime_data.parquet
          git add data/processed/crime/crime_data_metadata.json

          git add data/processed/uof/uof_data.parquet
          git add data/processed/uof/uof_metadata.json

          git add data/processed/geography/crime_event_mcpp_lookup.parquet

          git status --short

          if git diff --cached --quiet; then
            echo "No refreshed data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh dashboard data"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push refresh branch
        if: steps.commit_refresh.outputs.changed == 'true'
        run: |
          git push --set-upstream origin "$REFRESH_BRANCH"

      - name: Open and merge refresh pull request
        if: steps.commit_refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
        run: |
          pr_url="$(
            gh pr create \
              --base main \
              --head "$REFRESH_BRANCH" \
              --title "Refresh dashboard data" \
              --body "Automated daily refresh of the SPD calls, crime, and use of force dashboard datasets."
          )"

          echo "Created pull request: $pr_url"

          gh pr merge "$pr_url" \
            --auto \
            --squash \
            --delete-branch
