name: Daily SPD dashboard refresh

on:
  workflow_call:
    secrets:
      REFRESH_PR_TOKEN:
        required: true
      CARTO_BASEMAP_API_KEY:
        required: true
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"   

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-spd-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    env:
      REFRESH_BRANCH: automation/daily-data-refresh-${{ github.run_id }}
      CARTO_BASEMAP_API_KEY: ${{ secrets.CARTO_BASEMAP_API_KEY }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create refresh branch
        run: |
          git switch -c "$REFRESH_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      - name: Refresh SPD calls data
        run: |
          python -m scripts.dashboard.refresh_spd_data

      - name: Refresh SPD crime data
        run: |
          python -m scripts.dashboard.refresh_crime_data

      - name: Remove generated geography lookup caches
        run: |
          rm -f data/processed/geography/event_mcpp_lookup.parquet
          rm -f data/processed/geography/crime_event_mcpp_lookup.parquet

      - name: Rebuild dashboard contexts
        run: |
          python -c "from dashboard.spd_dashboard_data import load_dashboard_context; load_dashboard_context(); print('Calls context loaded')"
          python -c "from dashboard.crime_dashboard_data import load_crime_dashboard_context; load_crime_dashboard_context(); print('Crime context loaded')"

      - name: Run smoke tests
        run: |
          python -m scripts.dashboard.smoke_check

      - name: Run dashboard freshness tests
        run: |
          python -m pytest tests/dashboard/test_data_freshness.py -q

      - name: Commit refreshed data
        id: commit_refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/processed/spd_calls.parquet
          git add data/processed/spd_calls_metadata.json

          git add data/processed/crime/crime_data.parquet
          git add data/processed/crime/crime_data_metadata.json

          git add data/processed/geography/event_mcpp_lookup.parquet
          git add data/processed/geography/crime_event_mcpp_lookup.parquet

          git status --short

          if git diff --cached --quiet; then
            echo "No refreshed data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh dashboard data"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push refresh branch
        if: steps.commit_refresh.outputs.changed == 'true'
        run: |
          git push --set-upstream origin "$REFRESH_BRANCH"

      - name: Open and merge refresh pull request
        if: steps.commit_refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
        run: |
          pr_url="$(
            gh pr create \
              --base main \
              --head "$REFRESH_BRANCH" \
              --title "Refresh dashboard data" \
              --body "Automated daily refresh of the SPD calls and crime dashboard datasets."
          )"

          echo "Created pull request: $pr_url"

          gh pr merge "$pr_url" \
            --auto \
            --squash \
            --delete-branch
